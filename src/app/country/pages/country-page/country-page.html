<h1 class="mt-3">Selectores anidados</h1>
<hr />

<form [formGroup]="myForm">
  <!-- Region -->
  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Continente:</label>
      <select formControlName="region" class="form-control">
        <option value="">-- Seleccione Continente --</option>

        @for (region of regions(); track region) {
          <option [value]="region">
            {{ region }}
          </option>
        }
      </select>
    </div>
  </div>

  <!-- Countries -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">País:</label>
      <select
        formControlName="country"
        class="form-control"
      >
        <option value="">-- Seleccione País --</option>
        @for (country of countriesByRegion(); track country.cca2) {
          <option [value]="country.cca2">
            {{ country.name }}
          </option>
        }
      </select>

      @if (countriesError()) {
        <div class="alert alert-danger mt-2">
          {{ countriesError() }}
        </div>
      }
    </div>
  </div>


  <!-- Countries -->

  <div class="row mb-3">
    <div class="col">
      <label class="form-label">Fronteras:</label>
      <select formControlName="border" class="form-control">
        <option value="">-- Seleccione la frontera --</option>
        @for (border of bordersByCountry(); track border.cca3) {

          <option [value]="border.cca3">
            {{ border.name }}
          </option>
        }
      </select>

      @if (borderError()) {
        <div class="alert alert-danger mt-2">
          {{ borderError() }}
        </div>
      }
    </div>
  </div>

</form>

<h3>Formulario</h3>
<code>
  <!-- {{ 'myForm.value' | json }} -->
</code>
<p>is form valid: {{ myForm.valid }}</p>
<p>Value: {{ myForm.value | json }}</p>
